<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1EBE3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2E2D2C" media="(prefers-color-scheme: dark)">
<title>StratiGraph · field assistant</title>
<link rel="icon" href="./brand/logo/favicon-deep-charcoal.svg" type="image/svg+xml">
<!--
  The field client (design note §6): a PWA, not a native app. ATRIUM is already
  a web app, the ecosystem is web-first, and one codebase reaches phones and
  tablets on both platforms with camera, microphone and GPS through the browser.
  The heavy AI stays on the node; this stays thin.

  Deliberately no framework and no build step: it is served by the Field
  Computing Node to a device on a trench's wifi, and every kilobyte and every
  dependency is a thing that can fail three metres underground.

  THE LOOK is the StratiGraph guidebook's (WP1), and it arrives as a VENDORED
  theme — `brand/`, copied in by `sync-brand.sh` from `stratigraph-brand/`. Not a
  CDN and not a fetch from the node: this has to be legible when the node is the
  thing that is down. Every colour below is a role token from that file; there
  is not one hex in this page.
-->
<link rel="stylesheet" href="./brand/stratigraph-theme.css">
<style>
  * { box-sizing: border-box; }
  /* `hidden` is made to win in the THEME, not here: it is a thing all four
     StratiGraph faces need, and this page is where the bug was found, not where
     it belongs. See `[hidden]` in `brand/stratigraph-theme.css`. */
  body {
    margin: 0;
    font: var(--sg-weight-body) 16px/1.55 var(--sg-font-sans);
    background: var(--sg-bg);
    color: var(--sg-text);
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }

  /* ── the header: the hourglass, who we are, whether the node answers ────── */
  header {
    display: flex; align-items: center; gap: var(--sg-space-3);
    padding: var(--sg-space-4) var(--sg-space-4) var(--sg-space-3);
    border-bottom: 1px solid var(--sg-line);
  }
  header img { width: 30px; height: 30px; flex: none; }
  /* The mark is dark ink on the light ground and light ink on the dark one —
     the guidebook ships both, so neither is a filter over the other. */
  @media (prefers-color-scheme: dark) {
    header img { content: url("./brand/logo/favicon-off-white.svg"); }
  }
  .brand { line-height: 1; }
  .brand b {
    font-family: var(--sg-font-display); font-weight: var(--sg-weight-headline);
    font-size: var(--sg-text-lg); letter-spacing: .2px;
  }
  /* Sentence case. The guidebook's voice is quiet; SHOUTING IN CAPS is not it —
     the one exception is this label, where the letter-spacing does the work of
     a rule and the words are two. */
  .brand span {
    display: block; margin-top: 2px;
    font-size: var(--sg-text-xs); color: var(--sg-accent-quiet);
    letter-spacing: .6px;
  }
  /* The language picker: small, in the header, one touch away. A device that
     changes hands changes language with it, and a settings screen is a place
     nobody finds with gloves on. */
  .lang {
    margin-left: auto;
    font: inherit; font-size: var(--sg-text-xs);
    padding: 6px 8px; border-radius: var(--sg-radius-sm);
    background: var(--sg-surface); color: var(--sg-text);
    border: 1px solid var(--sg-line);
  }
  .state {
    text-align: right;
    font-family: var(--sg-font-mono); font-size: var(--sg-text-xs);
    color: var(--sg-muted);
  }
  .state.off { color: var(--sg-warn); }

  main { padding: var(--sg-space-4); max-width: 640px; margin: 0 auto; }

  /* ── the gestures. Big targets: used with gloves on, standing in a trench. ─ */
  button {
    font: inherit; width: 100%; margin-bottom: var(--sg-space-3);
    padding: 18px; text-align: left; cursor: pointer;
    background: var(--sg-surface); color: var(--sg-text);
    border: 1px solid var(--sg-line); border-radius: var(--sg-radius);
    box-shadow: var(--sg-shadow);
  }
  button:active { background: var(--sg-surface-sunk); }
  button[disabled] { opacity: .45; box-shadow: none; }
  /* The primary action is Burnt Orange — the guidebook's action colour, used
     for the action and for nothing else on this screen.

     AND ITS LABEL IS 19px/600, which is not a style choice. White on Burnt
     Orange measures 3.53 (and Deep Charcoal on it, 3.89): both fail AA's 4.5
     for normal text. At 19px semibold the label is WCAG "large text"
     (>= 14pt bold), where the bar is 3:1 — which 3.53 clears. So the brand's
     action colour keeps its job and the words stay readable, and the size is
     right for a gloved hand anyway. Shrinking this label breaks the contrast;
     that is why the number is here. */
  button.primary {
    background: var(--sg-accent); border-color: var(--sg-accent);
    color: #FFFFFF; font-size: 19px; font-weight: 600;
  }
  button.primary:active { background: var(--sg-accent-quiet);
                          border-color: var(--sg-accent-quiet); }
  .row { display: flex; gap: var(--sg-space-3); }
  .row button { margin-bottom: 0; }

  input[type=text] {
    font: inherit; width: 100%; padding: 16px;
    margin-bottom: var(--sg-space-3);
    background: var(--sg-surface); color: var(--sg-text);
    border: 1px solid var(--sg-line); border-radius: var(--sg-radius);
  }
  input[type=text]::placeholder { color: var(--sg-muted); opacity: .7; }

  .hint { font-size: var(--sg-text-sm); color: var(--sg-muted); margin: 0 0 var(--sg-space-2); }

  /* What was heard, in the reader's own words — Clay Beige is the guidebook's
     "the person's side" colour, and it is the one place it appears. */
  .said {
    /* A bubble on the reader's side, like the mockup's thread: right-aligned
       and NOT full width, so the two voices are distinguishable at a glance
       before a word is read. `margin-left:auto` rather than a flex row —
       there is no row to make, and one line of CSS beats a wrapper element
       the script would have to know about. */
    max-width: 78%; margin: var(--sg-space-1) 0 var(--sg-space-3) auto;
    width: fit-content;
    font-size: var(--sg-text-sm); color: var(--sg-text);
    padding: 10px 13px; border-radius: var(--sg-radius-lg);
    border-bottom-right-radius: var(--sg-radius-sm);
    background: color-mix(in srgb, var(--sg-quiet) 45%, transparent);
  }
  .said:empty { display: none; padding: 0; background: none; }

  /* The node's answer: a card, with the state carried by the left rule rather
     than by the whole surface — a wash of Soft Neon Green behind a sentence
     would be unreadable (1.36 against Off-White, measured in the theme). */
  .answer {
    /* …and the node's side is a card, left, with the corner nearest the
       speaker squared off — the mockup's asymmetry, which is what makes a
       thread read as a conversation rather than as a list. */
    max-width: 86%; width: fit-content;
    background: var(--sg-surface); border: 1px solid var(--sg-line);
    border-left: 4px solid var(--sg-info);
    border-radius: var(--sg-radius);
    border-bottom-left-radius: var(--sg-radius-sm);
    padding: 14px;
    margin-top: var(--sg-space-4); box-shadow: var(--sg-shadow);
  }
  .answer.ok  { border-left-color: var(--sg-ok); }
  .answer.bad { border-left-color: var(--sg-warn); }

  .queue {
    font-family: var(--sg-font-mono); font-size: var(--sg-text-xs);
    color: var(--sg-muted); margin-top: var(--sg-space-4);
  }
  .queue:empty { display: none; }

  /* ── the signature: who this device writes as, and how to hand it over ──
     A strip of its own under the header rather than a third thing crammed into
     it: on a phone held sideways in a trench the header already carries the
     mark, the name and the node's state, and an ORCID is 19 characters. It also
     reads as what it is — a signature line, the thing you check before you
     dictate. */
  .signature {
    display: flex; align-items: center; gap: var(--sg-space-2);
    padding: 9px var(--sg-space-4);
    border-bottom: 1px solid var(--sg-line);
    background: var(--sg-surface-sunk);
    font-family: var(--sg-font-mono); font-size: var(--sg-text-xs);
    color: var(--sg-muted);
  }
  .signature b {
    font-family: var(--sg-font-sans); font-weight: 600;
    font-size: var(--sg-text-sm); color: var(--sg-text);
  }
  /* The hand-over. Small on purpose — it must be reachable in seconds (the
     tablet changes hands all day) and not reachable by a thumb steadying the
     device. */
  .signature button {
    width: auto; margin: 0 0 0 auto; padding: 8px 13px;
    font-size: var(--sg-text-xs); box-shadow: none;
  }

  /* ── the gate ─────────────────────────────────────────────────────────────
     What stands where the three gestures are when nobody has signed. Not a
     banner over a working page: the page does not work, and showing an input
     that accepts dictation it could never attribute would be the worst lie to
     put in the hands of somebody standing in a trench. */
  #gate p { margin: 0 0 var(--sg-space-4); }

  img.shot {
    max-width: 100%; border-radius: var(--sg-radius);
    margin-top: var(--sg-space-3); border: 1px solid var(--sg-line);
  }
</style>
</head>
<body>
<header>
  <img src="./brand/logo/favicon-deep-charcoal.svg" alt="" width="30" height="30">
  <div class="brand"><b>StratiGraph</b><span id="app-subtitle">field assistant</span></div>
  <!-- The language picker, in the header and not behind a settings screen: on a
       device that changes hands the language changes with it, and it has to cost
       one touch. Each option is written IN its own language, so somebody who
       cannot read the current one can still find their own. -->
  <select class="lang" id="lang" aria-label="Language"></select>
  <span class="state" id="state">…</span>
</header>
<div class="signature" id="signature" hidden>
  <span id="signed-as">signed in as</span> <b id="who-name"></b>
  <span id="who-subject"></span>
  <button id="signout">Sign out</button>
</div>
<main>
  <!-- Nobody has signed: this is the whole screen. -->
  <section id="gate" hidden>
    <p class="hint" id="gate-why"></p>
    <button class="primary" id="signin" hidden>✍️ Sign in to begin</button>
  </section>

  <!-- The three gestures of the MVP, and nothing else on the screen. -->
  <section id="work" hidden>
    <button class="primary" id="rec">🎙 Hold and speak</button>
    <div class="row">
      <button id="shoot">📷 Photo</button>
      <button id="where">📍 Where am I</button>
    </div>
    <p class="hint" id="hint">If there is no microphone, type the command below.</p>
    <!-- The placeholder is NOT translated: it is an example of a command THIS
         NODE understands, and the node publishes its vocabulary at /v1/tools.
         A Polish example of a phrase the node would refuse is the one lie this
         page must not tell — see `commands.in` below it. -->
    <input type="text" id="typed" enterkeyhint="send">
    <button id="send">Send</button>
    <p class="hint" id="commands-in"></p>
    <img class="shot" id="shot" hidden alt="">
    <div class="said" id="said"></div>
  </section>

  <div class="answer" id="answer" hidden></div>
  <div class="queue" id="queue"></div>
</main>

<input type="file" id="camera" accept="image/*" capture="environment" hidden>

<script>
// ── the language ────────────────────────────────────────────────────────────
//
// English is the source language of every StratiGraph surface. Beside it, the
// languages of the project's case studies (T2.3) — the ones somebody will
// actually excavate in: it · ro · el · es · pl.
//
// `en` and `it` are complete; the other four carry THE SAME KEYS with empty
// values, which fall back to English. That is not laziness: translating is the
// partners' work, each for their own language and their own dig, and a string
// invented by us in a language none of us re-reads is worse than the English.
// A test checks that no locale has a hole, because a hole is a missing sentence
// in a trench.
//
// Keys are ENGLISH PHRASES, not `msg_1`: a key you can read is a key you can
// check against the screen without running anything.
//
// WHERE THE CHOICE LIVES, and this has been reasoned twice: the language may sit
// on disk. It is not a credential, and it is a property of the DEVICE and not of
// the person — like the queue, and unlike the token. A borrowed tablet must
// change author, not language.
const LOCALES = ["en", "it", "ro", "el", "es", "pl"];
const LOCALE_NAMES = { en: "English", it: "Italiano", ro: "Română",
                       el: "Ελληνικά", es: "Español", pl: "Polski" };
const LOCALE_KEY = "sg.locale.v1";

const STRINGS = {
  en: {
    "app.subtitle": "field assistant",
    "signed.as": "signed in as",
    "action.signout": "Sign out",
    "action.signin": "✍️ Sign in to begin",
    "gate.why.canSign": "Sign in with your identity: what you dictate enters the graph under your name.",
    "gate.why.noAuth": "This node does not ask for a signature, so it can attribute nothing you would say: dictations would be refused.",
    "gate.why.missing": "Missing: {what}.",
    "gate.why.unreachable": "I cannot ask the node how to sign in. Without a signature I cannot accept dictation, because nobody could be its author.",
    "action.record": "🎙 Hold and speak",
    "action.shoot": "📷 Photo",
    "action.where": "📍 Where am I",
    "action.send": "Send",
    "hint.type": "If there is no microphone, type the command below.",
    "hint.noListen": "This browser does not listen: type the command.",
    "hint.nodeListens": "Speak: the recording goes to the node, which transcribes it.",
    "listening": "Listening…",
    "heard": "I heard: ",
    "read": "I read: ",
    "notHeard": "I did not hear anything.",
    "notHeard.offline": "I did not hear anything — this browser sends the recording to a remote server to transcribe it, and there is no network. Type the command.",
    "recording": "Recording… release to send.",
    "node.room": "node · room",
    "node.local": "node · local",
    "node.offline": "offline",
    "queue.mine": "{n} queued, I will send them when the node is back.",
    "queue.theirs.one": "1 note by {who}, waiting for them to return.",
    "queue.theirs.many": "{n} notes by {who}, waiting for them to return.",
    "queue.unsigned.one": "1 note with no signature, dictated before signing existed: it stays in the queue.",
    "queue.unsigned.many": "{n} notes with no signature, dictated before signing existed: they stay in the queue.",
    "queue.sent.one": "I sent 1 queued thing.",
    "queue.sent.many": "I sent {n} queued things.",
    "queue.kept": "Node unreachable: I put it in the queue.",
    "signin.failed": "Sign-in failed: ",
    "signin.noPending": "this tab had no sign-in in progress.",
    "signin.badState": "the sign-in state does not match: refusing a code this tab did not ask for.",
    "signin.noKeycloak": "I cannot reach Keycloak from this device.",
    "signin.noToken": "Keycloak returned no token.",
    "signin.answered": "Keycloak answered {status}",
    "signout.local": "Signed out of this device. The node publishes no realm logout, so the Keycloak session may still be open.",
    "here": "Here: {lat}, {lon}",
    "lang.label": "Language",
    "commands.in": "This node understands commands in {language}.",
  },
  it: {
    "app.subtitle": "assistente di campo",
    "signed.as": "firmato",
    "action.signout": "Esci",
    "action.signin": "✍️ Firma per iniziare",
    "gate.why.canSign": "Firma con la tua identità: quello che detti entra nel grafo a tuo nome.",
    "gate.why.noAuth": "Questo nodo non chiede la firma, quindi non può attribuire a nessuno quello che diresti: le dettature verrebbero rifiutate.",
    "gate.why.missing": "Manca: {what}.",
    "gate.why.unreachable": "Non riesco a chiedere al nodo come si firma. Senza firma non posso accettare dettature, perché nessuno potrebbe esserne l'autore.",
    "action.record": "🎙 Tieni premuto e parla",
    "action.shoot": "📷 Scatta",
    "action.where": "📍 Dove sono",
    "action.send": "Manda",
    "hint.type": "Se il microfono non c'è, scrivi il comando qui sotto.",
    "hint.noListen": "Questo browser non ascolta: scrivi il comando.",
    "hint.nodeListens": "Parla: la registrazione va al nodo, che la trascrive.",
    "listening": "In ascolto…",
    "heard": "Ho sentito: ",
    "read": "Ho letto: ",
    "notHeard": "Non ho sentito.",
    "notHeard.offline": "Non ho sentito — questo browser manda la registrazione a un server remoto per trascriverla, e la rete non c'è. Scrivi il comando.",
    "recording": "Sto registrando… rilascia per mandare.",
    "node.room": "nodo · stanza",
    "node.local": "nodo · locale",
    "node.offline": "offline",
    "queue.mine": "{n} in coda, li mando appena torna il nodo.",
    "queue.theirs.one": "1 nota di {who} in attesa che rientri.",
    "queue.theirs.many": "{n} note di {who} in attesa che rientri.",
    "queue.unsigned.one": "1 nota senza firma, dettata prima che la firma esistesse: resta in coda.",
    "queue.unsigned.many": "{n} note senza firma, dettate prima che la firma esistesse: restano in coda.",
    "queue.sent.one": "Ho mandato 1 cosa in coda.",
    "queue.sent.many": "Ho mandato {n} cose in coda.",
    "queue.kept": "Nodo non raggiungibile: l'ho messo in coda.",
    "signin.failed": "Firma non riuscita: ",
    "signin.noPending": "questa scheda non aveva una firma in corso.",
    "signin.badState": "lo stato della firma non corrisponde: rifiuto un codice che questa scheda non ha chiesto.",
    "signin.noKeycloak": "non raggiungo Keycloak da questo dispositivo.",
    "signin.noToken": "Keycloak non ha restituito un token.",
    "signin.answered": "Keycloak ha risposto {status}",
    "signout.local": "Uscito da questo dispositivo. Il nodo non espone un logout del realm, quindi la sessione di Keycloak può essere ancora aperta.",
    "here": "Qui: {lat}, {lon}",
    "lang.label": "Lingua",
    "commands.in": "Questo nodo capisce i comandi in {language}.",
  },
  // ── the partners' slots: same keys, empty values, falling back to `en` ──────
  ro: {}, el: {}, es: {}, pl: {},
};
// Every locale carries every key of `en` — empty where nobody has translated it
// yet, so a translator sees the whole list and a test can count the holes.
for (const code of LOCALES) {
  for (const key of Object.keys(STRINGS.en)) {
    if (!(key in STRINGS[code])) STRINGS[code][key] = "";
  }
}

function pickLocale() {
  // an explicit choice wins, and it is remembered on THIS DEVICE
  try {
    const saved = localStorage.getItem(LOCALE_KEY);
    if (saved && LOCALES.includes(saved)) return saved;
  } catch { /* a browser with no storage: the browser's own language decides */ }
  const asked = (navigator.language || "en").slice(0, 2).toLowerCase();
  return LOCALES.includes(asked) ? asked : "en";
}

let LOCALE = pickLocale();

/** A string in the active locale, falling back to English when nobody has
 *  translated it. `{placeholders}` are filled from `values`. */
function t(key, values) {
  const text = (STRINGS[LOCALE] && STRINGS[LOCALE][key]) || STRINGS.en[key] || key;
  return values
    ? text.replace(/\{(\w+)\}/g, (_m, name) => String(values[name] ?? ""))
    : text;
}

function setLocale(code) {
  if (!LOCALES.includes(code)) return;
  LOCALE = code;
  try { localStorage.setItem(LOCALE_KEY, code); } catch { /* nothing to do */ }
  document.documentElement.lang = code;
  paintStrings();
}

// ── the node ────────────────────────────────────────────────────────────────
// Same origin: this page is served BY the field node, so there is no host to
// configure and nothing to get wrong on a phone somebody just handed you.
// WHERE THE NODE IS, derived from this document's own URL — never written down.
//
// The page is served at the origin's root in development (`uvicorn --port 8020`,
// with `--reload`, which is a loop worth keeping) and under `/chat/` behind the
// node's Caddy, where every StratiGraph face shares one https origin. Under a
// prefix, `location.origin` is WRONG in a way that does not look wrong: it makes
// `/v1/say` mean the ROOM SERVER's `/v1/say`, because on a shared origin `/v1`
// is not this app's.
//
// `new URL(".", href)` is the document's own directory: `http://host:8020/` in
// development, `https://host:8443/chat/` behind the proxy. Same page, both
// places, and nothing to configure.
const HERE = new URL(".", location.href).href;
const NODE = HERE.replace(/\/+$/, "");

// ── who is writing ──────────────────────────────────────────────────────────
//
// THE RULE THIS SECTION EXISTS FOR: no ingestion without an author. A card
// dictated in a trench that enters the graph without saying who dictated it is
// not a record with a field missing — it is a record nobody can use, because
// attribution, embargo, licence and the whole DTC plan rest on who did what.
// The node already refuses to write without an identity (`contract.py`:
// "Non posso scrivere senza sapere chi sei"); this is the same rule made
// visible, BEFORE somebody speaks into a form that could never keep it.
//
// The corollary, accepted: one device, one signed person at a time. A tablet
// that changes hands does not become anonymous — it changes signature, and the
// change has to cost seconds.
//
// The flow is Authorization Code + PKCE IN THE BROWSER, and deliberately not
// the loopback dance the three native surfaces do (EMStudio, EMtools, the
// chatbot process): those open a listener on 127.0.0.1 because they have no URL
// of their own. A page has one, and it is its own. The shape below is the
// node console's `app/node_admin/auth.js`, which does this already — read that
// file for the long version of every comment here; it is not vendored because
// this page has no build step and no imports on purpose.
//
// The token is kept in memory only — never in localStorage. A field device is
// lent, dropped and borrowed; a token on its disk outlives the person holding it.
let TOKEN = "";
//: who that token says is speaking: {subject, name}. `subject` is the ORCID —
//: a public identifier, the very one that lands in the graph, which is why it
//: may be written next to a queued note while the token may not.
let WHO = null;
//: how this node wants a browser to sign in (`GET /v1/auth-config`), or null.
let AUTHCFG = null;
//: {language, example} — WHICH language this node's commands are in, and one of
//: its own phrases to show as an example. From `GET /v1/tools`, which publishes
//: the vocabulary; never invented here.
let NODE_COMMANDS = null;

// The SERVICE DOOR, kept on purpose: `?token=…` is how the smokes and the bench
// drive this page without a person in front of Keycloak. It is not scrubbed off
// the address bar the way an authorization code is, and that is a decision, not
// an oversight: the whole convenience of the door is that the URL carries the
// token, and a page that forgot it on reload would be a bench trick that works
// once. It is therefore a HAZARD in a screenshot — which is exactly why it is a
// bench door and not the way anybody signs.
const SERVICE_TOKEN = new URLSearchParams(location.search).get("token") || "";

// Where an ORCID lands in a Keycloak token, in the spellings a realm may use.
// THE SAME LIST AND THE SAME ORDER as `ORCID_CLAIMS` in `app/auth.py`: the node
// stamps the author from the token, this page only SHOWS it and files it beside
// a queued note, and the two disagreeing would mean a queue held for a person
// the node thinks is somebody else.
const ORCID_CLAIMS = ["orcid", "orcid_id", "https://orcid.org/id",
                      "preferred_username"];

// The claims, read WITHOUT verifying the signature — display only, and it must
// stay that way. Nothing here decides anything: the node checks the signature
// against the realm's JWKS and takes the author from what it verified. A page
// that trusted this would be a page you could talk into a name.
function claimsOf(jwt) {
  try {
    const payload = String(jwt).split(".")[1];
    const bytes = Uint8Array.from(
      atob(payload.replace(/-/g, "+").replace(/_/g, "/")),
      (c) => c.charCodeAt(0));
    return JSON.parse(new TextDecoder().decode(bytes)) || {};
  } catch { return {}; }
}

function subjectOf(claims) {
  for (const key of ORCID_CLAIMS) {
    const value = claims[key];
    if (typeof value === "string" && value.trim()) return value.trim();
  }
  return claims.sub ? String(claims.sub) : "";
}

/** Adopt a token: this is the ONE place TOKEN is assigned from. */
function adopt(token) {
  TOKEN = token || "";
  const claims = TOKEN ? claimsOf(TOKEN) : {};
  WHO = TOKEN
    ? { subject: subjectOf(claims),
        name: claims.name || claims.preferred_username || subjectOf(claims) }
    : null;
  render();
}

const $ = (id) => document.getElementById(id);
const state = $("state"), answerBox = $("answer"), saidBox = $("said");

/** Show an answer, and read it out loud — the person hearing it has their hands
 *  in the soil.
 *
 *  `lang` is the language of THIS MESSAGE, and it is not always the chrome's.
 *  An answer built by the node arrives in the node's language; a sentence built
 *  by this page arrives in the reader's. Speaking one with the other's voice is
 *  the mistake that used to be hard-coded here as `it-IT`.
 */
function show(ok, message, detail, lang) {
  answerBox.hidden = false;
  answerBox.className = "answer " + (ok ? "ok" : "bad");
  answerBox.textContent = message + (detail ? ` (${detail})` : "");
  answerBox.lang = lang || nodeLanguage();
  speak(message, lang || nodeLanguage());
}

// ── the voice ───────────────────────────────────────────────────────────────
//
// The SYNTHESIS is the operating system's (Web Speech API): nothing to install,
// no model to ship to a tablet. But the voices are not interchangeable and this
// is measured rather than assumed:
//
//   · the voice must MATCH the language of the sentence. Reading Romanian with
//     an Italian voice is worse than silence — it is confidently wrong;
//   · `localService` first. A network voice is silent on a node with no uplink,
//     which is exactly where we work;
//   · if there is no voice for that language, DO NOT SPEAK. The text stays on
//     screen, which is the honest outcome.
//
// `getVoices()` is empty until the engine has loaded them, and it fires
// `voiceschanged` when it has — so this asks each time rather than caching a
// list that was empty at boot.
function voiceFor(lang) {
  let voices = [];
  try { voices = speechSynthesis.getVoices() || []; } catch { return null; }
  const wanted = String(lang || "").slice(0, 2).toLowerCase();
  const matching = voices.filter(
    (v) => String(v.lang || "").slice(0, 2).toLowerCase() === wanted);
  if (!matching.length) return null;
  return matching.find((v) => v.localService) || matching[0];
}

function speak(message, lang) {
  const voice = voiceFor(lang);
  if (!voice) return;      // no voice for this language: the text is still there
  try {
    const say = new SpeechSynthesisUtterance(message);
    say.voice = voice;
    say.lang = voice.lang;
    speechSynthesis.speak(say);
  } catch { /* the engine refused: the text is still there */ }
}

/** The language the NODE speaks — its commands and its answers. Falls back to
 *  the reader's locale only when the node has not said, which is the one case
 *  where guessing costs nothing. */
const nodeLanguage = () => (NODE_COMMANDS && NODE_COMMANDS.language) || LOCALE;

// ── the screen, repainted in the active language ────────────────────────────
//
// One function, called at boot and on every change of language. It repaints the
// STATIC labels; everything the page says at a moment (an answer, a queue line)
// is built with `t()` where it is built, so it is already in the right language.
function paintStrings() {
  const set = (id, text) => { const n = $(id); if (n) n.textContent = text; };
  set("app-subtitle", t("app.subtitle"));
  set("signed-as", t("signed.as"));
  set("signout", t("action.signout"));
  set("signin", t("action.signin"));
  set("rec", t("action.record"));
  set("shoot", t("action.shoot"));
  set("where", t("action.where"));
  set("send", t("action.send"));
  set("hint", recognitionHint());
  document.title = "StratiGraph · " + t("app.subtitle");
  paintCommandLanguage();
  render();
}

/** What the node understands, and an example of it.
 *
 *  The placeholder is the node's OWN phrase — the first one its registry
 *  declares for creating a unit — and never a translation of it. And when the
 *  reader's language is not the node's, the page SAYS which language the
 *  commands are in, because otherwise a Polish interface silently invites a
 *  Polish sentence that the node will refuse. */
function paintCommandLanguage() {
  const typed = $("typed");
  const line = $("commands-in");
  if (!NODE_COMMANDS) { if (typed) typed.placeholder = ""; return; }
  if (typed) typed.placeholder = NODE_COMMANDS.example || "";
  const language = NODE_COMMANDS.language || "";
  if (!line) return;
  line.textContent = (language && language !== LOCALE)
    ? t("commands.in", { language: LOCALE_NAMES[language] || language })
    : "";
}

function paintLanguagePicker() {
  const picker = $("lang");
  if (!picker) return;
  picker.innerHTML = "";
  for (const code of LOCALES) {
    const option = document.createElement("option");
    option.value = code;
    // …written in its OWN language: somebody who cannot read the current one
    // must still be able to find theirs in the list.
    option.textContent = LOCALE_NAMES[code];
    if (code === LOCALE) option.selected = true;
    picker.appendChild(option);
  }
  picker.addEventListener("change", () => setLocale(picker.value));
}

// ── signing in ──────────────────────────────────────────────────────────────

/** The redirect URI: this page's own directory, WITH its trailing slash.
 *
 *  Computed and never written down, for the same reason `NODE` is: the page is
 *  served at `http://localhost:8020/` in development and at
 *  `https://…:8443/chat/` behind the node's Caddy. Anything literal here would
 *  be right in one place and wrong in the other — and a wrong redirect URI
 *  fails at the IdP, far from the line that caused it. The realm has to list
 *  both; when it does not, Keycloak says so at the last step and `signInReturn`
 *  below surfaces that sentence rather than a code. */
const redirectUri = () => HERE;

/** WHAT THIS NODE UNDERSTANDS: the language of its command vocabulary, and one
 *  of its own phrases to show as an example.
 *
 *  From `GET /v1/tools`, which publishes the vocabulary and (since 2026-09-01)
 *  the language it is written in. The example is the node's OWN phrase — never
 *  a translation of it — because a translated example is an invitation to say
 *  something this node would refuse. */
async function loadNodeCommands() {
  try {
    const answer = await fetch(NODE + "/v1/tools",
                               { headers: { Accept: "application/json" } });
    if (!answer.ok) return null;
    const payload = await answer.json();
    const intents = payload.intents || {};
    // the longest phrase for creating a unit: the fullest example the node has
    const examples = Object.keys(intents)
      .filter((phrase) => intents[phrase] === "create_su")
      .sort((a, b) => b.length - a.length);
    return { language: payload.command_language || "",
             example: examples[0] || "" };
  } catch { return null; }
}

async function loadAuthConfig() {
  try {
    const answer = await fetch(NODE + "/v1/auth-config",
                               { headers: { Accept: "application/json" } });
    return answer.ok ? await answer.json() : null;
  } catch { return null; }
}

const canSign = () =>
  Boolean(AUTHCFG && AUTHCFG.enforcing && AUTHCFG.authorization_endpoint
          && AUTHCFG.client_id);

// The verifier and the state have to survive the trip to Keycloak and back —
// the page is unloaded in between — so they go in sessionStorage, which dies
// with the tab. They are not credentials: they are use-and-throw, and the
// verifier is DELETED the moment the code is exchanged. One left behind is a
// spare key on the doormat.
const PKCE_KEY = "sg.pkce" + location.pathname;

function base64url(bytes) {
  let text = "";
  for (const byte of bytes) text += String.fromCharCode(byte);
  return btoa(text).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

function randomToken() {
  const bytes = new Uint8Array(32);
  crypto.getRandomValues(bytes);
  return base64url(bytes);
}

async function challengeFor(verifier) {
  const digest = await crypto.subtle.digest(
    "SHA-256", new TextEncoder().encode(verifier));
  return base64url(new Uint8Array(digest));
}

/** Leave for Keycloak. Does not return: the browser navigates away. */
async function signIn() {
  if (!canSign()) return;
  const verifier = randomToken();
  const state = randomToken();
  sessionStorage.setItem(PKCE_KEY, JSON.stringify({ verifier, state }));
  const url = new URL(AUTHCFG.authorization_endpoint);
  url.searchParams.set("response_type", "code");
  url.searchParams.set("client_id", AUTHCFG.client_id);
  url.searchParams.set("redirect_uri", redirectUri());
  url.searchParams.set("scope", AUTHCFG.scope || "openid");
  url.searchParams.set("code_challenge", await challengeFor(verifier));
  url.searchParams.set("code_challenge_method", "S256");
  url.searchParams.set("state", state);
  location.assign(url.toString());
}

const returningFromIdp = () => {
  const query = new URLSearchParams(location.search);
  return query.has("code") || query.has("error");
};

/** Take `?code=…&state=…` off the address bar without reloading. An
 *  authorization code in the address bar is a code in the browser history and
 *  in every screenshot somebody takes of the screen. */
function cleanUrl() {
  history.replaceState({}, "", location.pathname);
}

/** Back from Keycloak: `?code=…` → a token in memory. */
function fail(why) { show(false, t("signin.failed") + why, "", LOCALE); render(); }

async function signInReturn() {
  const query = new URLSearchParams(location.search);
  const code = query.get("code");
  const error = query.get("error");
  const returned = query.get("state");
  let saved = null;
  try {
    const raw = sessionStorage.getItem(PKCE_KEY);
    sessionStorage.removeItem(PKCE_KEY);   // consumed on read
    saved = raw ? JSON.parse(raw) : null;
  } catch { /* a tab with no storage: treated as no sign-in in progress */ }
  cleanUrl();

  if (error) return fail(query.get("error_description") || error);
  if (!saved) return fail(t("signin.noPending"));
  // The one check that makes the round trip mean anything: a code delivered
  // with somebody else's state is a code this tab did not ask for.
  if (saved.state && returned !== saved.state) {
    return fail(t("signin.badState"));
  }
  let payload = null;
  try {
    const answer = await fetch(AUTHCFG.token_endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({
        grant_type: "authorization_code",
        client_id: AUTHCFG.client_id,
        code,
        redirect_uri: redirectUri(),
        code_verifier: saved.verifier,
      }).toString(),
    });
    payload = await answer.json().catch(() => null);
    if (!answer.ok) {
      return fail(payload?.error_description || payload?.error
                  || t("signin.answered", { status: answer.status }));
    }
  } catch {
    // The realm is reached by the BROWSER, not by the node, and behind a proxy
    // those are two different machines. Saying which one failed is the
    // difference between a fixable problem and a mystery.
    return fail(t("signin.noKeycloak"));
  }
  adopt(payload.access_token || "");
  if (!TOKEN) return fail(t("signin.noToken"));
}

/** Sign OUT of the realm, not only of this tab.
 *
 *  THE TRAP THIS CLOSES, and the reason the whole file exists: if "esci" merely
 *  forgot the token, the next touch on "firma" would bounce off Keycloak, find
 *  its session COOKIE still valid, and walk back in silently AS THE PREVIOUS
 *  PERSON. The tablet would change hands without changing author and nobody
 *  would see it. So the browser goes through `end_session_endpoint` first, and
 *  the page comes back unsigned because it comes back fresh. */
function signOut() {
  TOKEN = ""; WHO = null;
  if (AUTHCFG && AUTHCFG.end_session_endpoint && AUTHCFG.client_id) {
    const url = new URL(AUTHCFG.end_session_endpoint);
    url.searchParams.set("client_id", AUTHCFG.client_id);
    url.searchParams.set("post_logout_redirect_uri", redirectUri());
    location.assign(url.toString());
    return;
  }
  // No end-session endpoint: this tab is clean, and we SAY that the realm's
  // session is not — better a sentence than a silent half-logout.
  render();
  show(false, t("signout.local"), "", LOCALE);
}

// ── what the screen shows ───────────────────────────────────────────────────
function render() {
  const signed = Boolean(TOKEN);
  $("work").hidden = !signed;
  $("gate").hidden = signed;
  $("signature").hidden = !signed;
  if (signed) {
    $("who-name").textContent = WHO?.name || "—";
    $("who-subject").textContent = WHO?.subject ? "· " + WHO.subject : "";
  } else {
    $("signin").hidden = !canSign();
    $("gate-why").textContent = canSign()
      ? t("gate.why.canSign")
      : (AUTHCFG
         // A bare gate cannot be told apart from a forgotten variable, and the
         // person meeting it is standing in a trench. So the node NAMES what is
         // in the way (`missing`, the same list `/health` publishes) and the
         // gate repeats it — the habit `auth.py` set when it refuses to start
         // on a half-configured realm rather than behaving oddly.
         ? t("gate.why.noAuth")
           + (AUTHCFG.missing?.length
              ? " " + t("gate.why.missing", { what: AUTHCFG.missing.join(" · ") })
              : "")
         : t("gate.why.unreachable"));
  }
  renderQueue();
}

// ── the queue ───────────────────────────────────────────────────────────────
// Offline-first is the base case, not a fallback: a trench has no signal and
// the node is on the surface. Anything that cannot be sent now is kept, in
// order, and sent when the node answers again. Nothing is lost and nothing is
// sent twice out of order.
const QUEUE_KEY = "sg.queue.v1";
const readQueue = () => JSON.parse(localStorage.getItem(QUEUE_KEY) || "[]");
const writeQueue = (q) => localStorage.setItem(QUEUE_KEY, JSON.stringify(q));

// EVERY QUEUED NOTE CARRIES WHO DICTATED IT, stamped at the moment it was
// dictated. Without that: a note queued by Anna at 10:00 and sent at 14:00,
// when Marco is the one signed on the tablet, becomes a note BY MARCO — and the
// node cannot notice, because it takes the author from the token it sees and
// does the right thing with the wrong fact.
//
// The subject is an ORCID, which is not a credential: it is the public
// identifier that will end up in the graph anyway. So it may sit on disk beside
// the note. The token may not, and does not.
const isMine = (item, subject) => Boolean(subject) && item.subject === subject;

//: A note dictated before signatures existed on this device. It is not sent and
//: it is not silently re-attributed — both would be worse than waiting.
const UNSIGNED = "\u0000unsigned";

/** Which notes may go now, and which wait for whom. Pure, and named, because it
 *  is the whole of design note §3.2 and a rule worth stating is a rule worth
 *  running in a test. */
function partitionQueue(queue, subject) {
  const mine = [], held = [];
  for (const item of queue) (isMine(item, subject) ? mine : held).push(item);
  return { mine, held };
}

/** The held notes, counted by the person waiting for them. */
function heldBy(held) {
  const counts = new Map();
  for (const item of held) {
    const label = item.by || item.subject || UNSIGNED;
    counts.set(label, (counts.get(label) || 0) + 1);
  }
  return [...counts.entries()];
}

function queueSentence(queue, subject) {
  const { mine, held } = partitionQueue(queue, subject);
  const lines = [];
  if (mine.length) lines.push(t("queue.mine", { n: mine.length }));
  for (const [label, n] of heldBy(held)) {
    const many = n === 1 ? ".one" : ".many";
    lines.push(label === UNSIGNED
      ? t("queue.unsigned" + many, { n })
      : t("queue.theirs" + many, { n, who: label }));
  }
  return lines.join(" ");
}

function renderQueue() {
  $("queue").textContent = queueSentence(readQueue(), WHO?.subject || "");
}

async function post(path, body) {
  const res = await fetch(NODE + path, {
    method: "POST",
    headers: { "Content-Type": "application/json",
               ...(TOKEN ? { Authorization: "Bearer " + TOKEN } : {}) },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

async function send(path, body, describe) {
  try {
    const answer = await post(path, body);
    show(answer.ok, answer.message, answer.tool || "");
    return true;
  } catch (err) {
    const queue = readQueue();
    queue.push({ path, body, at: Date.now(), describe,
                 subject: WHO?.subject || "", by: WHO?.name || "" });
    writeQueue(queue);
    renderQueue();
    show(false, t("queue.kept"), describe, LOCALE);
    return false;
  }
}

async function flush() {
  const queue = readQueue();
  if (!queue.length) return;
  const subject = WHO?.subject || "";
  const left = [];
  let sent = 0;
  for (const item of queue) {
    // Somebody else's note WAITS. It is not refused, not re-attributed and not
    // lost — it goes back in the queue in its place, and the line under the
    // buttons says whose it is and that it is waiting for them.
    if (!isMine(item, subject)) { left.push(item); continue; }
    try { await post(item.path, item.body); sent++; }
    catch { left.push(item); }          // still down: keep the ORDER
  }
  writeQueue(left);
  renderQueue();
  if (sent) show(true, t("queue.sent" + (sent === 1 ? ".one" : ".many"), { n: sent }),
                 "", LOCALE);
}

// ── is the node there? ──────────────────────────────────────────────────────
async function ping() {
  try {
    const res = await fetch(NODE + "/health", { cache: "no-store" });
    const health = await res.json();
    state.className = "state";
    state.textContent = t(health.writes_to.startsWith("room") ? "node.room" : "node.local");
    // Which speech road, from what the node SAYS it has — asked every time, so a
    // node that gains (or loses) a model is followed rather than remembered.
    chooseSpeechRoad(health);
    flush();
  } catch {
    state.className = "state off";
    state.textContent = t("node.offline");
  }
}
$("signin").addEventListener("click", signIn);
$("signout").addEventListener("click", signOut);

// ── starting up ─────────────────────────────────────────────────────────────
//
// The order matters. The config comes FIRST because everything else is a
// decision that needs it: whether a sign-in is even possible, which endpoint to
// exchange a code at, what the gate should say. Only then is the returning
// `?code=` worth looking at — and only then does the screen get drawn, so that
// the three gestures never appear for an instant to somebody who has not signed.
async function boot() {
  // The language first, and the picker with it: everything drawn after this is
  // drawn once, in the right language, instead of flickering through English.
  document.documentElement.lang = LOCALE;
  paintLanguagePicker();
  // …then WHAT THE NODE UNDERSTANDS, because the placeholder, the recognition
  // language and the voice all follow the node and not the chrome.
  NODE_COMMANDS = await loadNodeCommands();
  AUTHCFG = await loadAuthConfig();
  if (returningFromIdp()) {
    await signInReturn();
  } else if (SERVICE_TOKEN) {
    adopt(SERVICE_TOKEN);               // the bench door, declared above
  }
  paintStrings();
  ping();
  setInterval(ping, 8000);
  addEventListener("online", flush);
  // The voices arrive after the engine has loaded them, and `getVoices()` is
  // empty until then — so nothing is cached and this only exists to repaint
  // once they are there, in case a first answer arrived silently.
  try { speechSynthesis.addEventListener("voiceschanged", () => {}); } catch {}
}
boot();

// ── speak ───────────────────────────────────────────────────────────────────
// The browser's own recogniser when it has one (it is free and it is on the
// device); the node's engine otherwise, by sending the recording. Either way
// the sentence goes to the same route.
// THREE ROADS, and THE NODE SAYS WHICH — not this page. Same discipline as
// `/v1/auth-config` and the front door's `/v1/node`: a capability is declared by
// whoever has it, and a surface shows what is there and names what is missing.
//
//   1 · the node transcribes  (`speech: "whisper (…)"`)
//       → record, and send AUDIO to `POST /v1/listen`. This is the road that
//         works in a trench with no uplink, because the model is on the node, a
//         LAN away. The node can carry models; the device stays thin.
//   2 · the node does not     (`speech: "passthrough"`)
//       → the browser's own recogniser, and send TEXT to `/say`, as before.
//         SAID OUT LOUD: on Chrome that recogniser ships the audio to a REMOTE
//         server, so it does not work without network — and when it fails the
//         page says that, instead of "I did not hear anything".
//   3 · neither
//       → type. And the page says so, rather than offering a button that does
//         nothing.
//
// The rule this is one case of: **if the node has an AI you have functions; if
// it does not, you do not — and the page says so.**
let SPEECH_ROAD = "type";
let recognition = null;
let recorder = null;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const canRecord = () => Boolean(navigator.mediaDevices
                                && navigator.mediaDevices.getUserMedia
                                && window.MediaRecorder);

function recognitionHint() {
  if (SPEECH_ROAD === "node") return t("hint.nodeListens");
  if (SPEECH_ROAD === "browser") return t("hint.type");
  return t("hint.noListen");
}

/** Which road, from what the node SAYS it has. Called on every `/health`. */
function chooseSpeechRoad(health) {
  const engine = String((health && health.speech) || "");
  const road = engine.startsWith("whisper") && canRecord() ? "node"
             : (!engine.startsWith("whisper") && SR) ? "browser"
             : "type";
  if (road === SPEECH_ROAD) return;
  SPEECH_ROAD = road;
  $("rec").disabled = road === "type";
  $("hint").textContent = recognitionHint();
}

// ── road 2 · the browser hears ──────────────────────────────────────────────
if (SR) {
  recognition = new SR();
  recognition.interimResults = false;
  recognition.onresult = (e) => {
    const said = e.results[0][0].transcript;
    saidBox.textContent = t("heard") + said;
    send("/v1/say", { transcript: said }, said);
  };
  // `network` is the error Chrome raises when it cannot reach its own
  // recogniser. Reporting it as "I did not hear anything" is what sends
  // somebody looking at the microphone instead of at the uplink.
  recognition.onerror = (e) => {
    const offline = e && (e.error === "network" || !navigator.onLine);
    show(false, t(offline ? "notHeard.offline" : "notHeard"), "", LOCALE);
  };
}

function listenInBrowser() {
  if (!recognition) return;
  // The recognition language is the NODE's, not the chrome's: the commands are
  // the node's phrasebook, and transcribing Italian speech with a Polish model
  // produces words — the wrong ones — and looks like "it misunderstands me".
  recognition.lang = nodeLanguage();
  saidBox.textContent = t("listening");
  try { recognition.start(); } catch { /* already listening */ }
}

// ── road 1 · the node hears ─────────────────────────────────────────────────
async function startRecording() {
  if (recorder) return;
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch {
    show(false, t("notHeard"), "", LOCALE);
    return;
  }
  const chunks = [];
  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    stream.getTracks().forEach((track) => track.stop());
    recorder = null;
    if (chunks.length) void sendRecording(new Blob(chunks));
  };
  recorder.start();
  saidBox.textContent = t("recording");
}

function stopRecording() {
  if (recorder && recorder.state !== "inactive") recorder.stop();
}

/** The recording to the node, which transcribes it and acts in one request.
 *
 *  `language` is the NODE's, for the same reason `recognition.lang` is: it is
 *  the language the phrases are in. Before this it was not sent at all and the
 *  engine fell through to a default — which used to be a hard-coded "it". */
async function sendRecording(blob) {
  const form = new FormData();
  form.append("audio", blob, "dictation.webm");
  form.append("language", nodeLanguage());
  saidBox.textContent = t("listening");
  try {
    const res = await fetch(NODE + "/v1/listen", {
      method: "POST",
      headers: { ...(TOKEN ? { Authorization: "Bearer " + TOKEN } : {}) },
      body: form,
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const answer = await res.json();
    if (answer.said) saidBox.textContent = t("heard") + answer.said;
    show(answer.ok, answer.message, answer.tool || "");
  } catch {
    // A recording cannot be queued the way a sentence can — the queue holds
    // JSON, and a blob on a tablet's disk is the thing this page does not keep.
    // So this is said and not stored, which is the honest half.
    show(false, t("queue.kept"), "", LOCALE);
  }
}

// ── the gesture, whichever road it takes ────────────────────────────────────
// Hold to record on the node's road, one touch on the browser's: the two are
// different acts and pretending they are the same would make one of them lie.
$("rec").addEventListener("click", () => {
  if (SPEECH_ROAD === "browser") listenInBrowser();
});
for (const event of ["pointerdown"]) {
  $("rec").addEventListener(event, () => {
    if (SPEECH_ROAD === "node") void startRecording();
  });
}
for (const event of ["pointerup", "pointercancel", "pointerleave"]) {
  $("rec").addEventListener(event, () => {
    if (SPEECH_ROAD === "node") stopRecording();
  });
}

// ── type ────────────────────────────────────────────────────────────────────
async function sendTyped() {
  const said = $("typed").value.trim();
  if (!said) return;
  saidBox.textContent = t("read") + said;
  $("typed").value = "";
  await send("/v1/say", { transcript: said }, said);
}
$("send").addEventListener("click", sendTyped);
$("typed").addEventListener("keydown", (e) => { if (e.key === "Enter") sendTyped(); });

// ── shoot ───────────────────────────────────────────────────────────────────
$("shoot").addEventListener("click", () => $("camera").click());
$("camera").addEventListener("change", async () => {
  const file = $("camera").files[0];
  if (!file) return;
  const shot = $("shot");
  shot.src = URL.createObjectURL(file);
  shot.hidden = false;
  const base64 = await new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(",")[1]);
    reader.readAsDataURL(file);
  });
  // Which unit? Whatever the last sentence said — and if it said none, the
  // node refuses and SAYS so, which is better than this page guessing.
  const us = (saidBox.textContent.match(/\b(\d{1,5})\b/) || [])[1] || "";
  await send("/v1/photo", {
    transcript: "questa foto è per la US " + us, us,
    photo_base64: base64, filename: file.name,
    media_type: file.type || "image/jpeg",
  }, file.name);
});

// ── where ───────────────────────────────────────────────────────────────────
$("where").addEventListener("click", () => {
  send("/v1/say", { transcript: "in che progetto sto lavorando" }, "progetto");
  navigator.geolocation?.getCurrentPosition(
    (pos) => { saidBox.textContent = t("here", {
      lat: pos.coords.latitude.toFixed(5), lon: pos.coords.longitude.toFixed(5) }); },
    () => { /* no fix: the answer above is still useful */ });
});

// The service worker, RELATIVE — and the scope is the reason, not the path.
//
// `register("/sw.js")` under `/chat/` fails twice: the file is not there, and a
// worker registered at the origin's root would claim scope `/` — intercepting
// the fetches of the room server, the catalogue and IIIF, which share this
// origin. That is a bug nobody sees until it is horrible.
//
// `./sw.js` resolves against this document, so the worker is fetched from
// `/chat/sw.js` and its scope is `/chat/` — its own directory, which is exactly
// the reach it should have. `scope: "./"` says so out loud rather than relying
// on the default; a WIDER scope would need a `Service-Worker-Allowed` header,
// and wanting one would be the sign of a mistake.
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(() => {});
}
</script>
