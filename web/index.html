<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1EBE3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2E2D2C" media="(prefers-color-scheme: dark)">
<title>StratiGraph · assistente di campo</title>
<link rel="icon" href="./brand/logo/favicon-deep-charcoal.svg" type="image/svg+xml">
<!--
  The field client (design note §6): a PWA, not a native app. ATRIUM is already
  a web app, the ecosystem is web-first, and one codebase reaches phones and
  tablets on both platforms with camera, microphone and GPS through the browser.
  The heavy AI stays on the node; this stays thin.

  Deliberately no framework and no build step: it is served by the Field
  Computing Node to a device on a trench's wifi, and every kilobyte and every
  dependency is a thing that can fail three metres underground.

  THE LOOK is the StratiGraph guidebook's (WP1), and it arrives as a VENDORED
  theme — `brand/`, copied in by `sync-brand.sh` from `stratigraph-brand/`. Not a
  CDN and not a fetch from the node: this has to be legible when the node is the
  thing that is down. Every colour below is a role token from that file; there
  is not one hex in this page.
-->
<link rel="stylesheet" href="./brand/stratigraph-theme.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: var(--sg-weight-body) 16px/1.55 var(--sg-font-sans);
    background: var(--sg-bg);
    color: var(--sg-text);
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }

  /* ── the header: the hourglass, who we are, whether the node answers ────── */
  header {
    display: flex; align-items: center; gap: var(--sg-space-3);
    padding: var(--sg-space-4) var(--sg-space-4) var(--sg-space-3);
    border-bottom: 1px solid var(--sg-line);
  }
  header img { width: 30px; height: 30px; flex: none; }
  /* The mark is dark ink on the light ground and light ink on the dark one —
     the guidebook ships both, so neither is a filter over the other. */
  @media (prefers-color-scheme: dark) {
    header img { content: url("./brand/logo/favicon-off-white.svg"); }
  }
  .brand { line-height: 1; }
  .brand b {
    font-family: var(--sg-font-display); font-weight: var(--sg-weight-headline);
    font-size: var(--sg-text-lg); letter-spacing: .2px;
  }
  /* Sentence case. The guidebook's voice is quiet; SHOUTING IN CAPS is not it —
     the one exception is this label, where the letter-spacing does the work of
     a rule and the words are two. */
  .brand span {
    display: block; margin-top: 2px;
    font-size: var(--sg-text-xs); color: var(--sg-accent-quiet);
    letter-spacing: .6px;
  }
  .state {
    margin-left: auto; text-align: right;
    font-family: var(--sg-font-mono); font-size: var(--sg-text-xs);
    color: var(--sg-muted);
  }
  .state.off { color: var(--sg-warn); }

  main { padding: var(--sg-space-4); max-width: 640px; margin: 0 auto; }

  /* ── the gestures. Big targets: used with gloves on, standing in a trench. ─ */
  button {
    font: inherit; width: 100%; margin-bottom: var(--sg-space-3);
    padding: 18px; text-align: left; cursor: pointer;
    background: var(--sg-surface); color: var(--sg-text);
    border: 1px solid var(--sg-line); border-radius: var(--sg-radius);
    box-shadow: var(--sg-shadow);
  }
  button:active { background: var(--sg-surface-sunk); }
  button[disabled] { opacity: .45; box-shadow: none; }
  /* The primary action is Burnt Orange — the guidebook's action colour, used
     for the action and for nothing else on this screen.

     AND ITS LABEL IS 19px/600, which is not a style choice. White on Burnt
     Orange measures 3.53 (and Deep Charcoal on it, 3.89): both fail AA's 4.5
     for normal text. At 19px semibold the label is WCAG "large text"
     (>= 14pt bold), where the bar is 3:1 — which 3.53 clears. So the brand's
     action colour keeps its job and the words stay readable, and the size is
     right for a gloved hand anyway. Shrinking this label breaks the contrast;
     that is why the number is here. */
  button.primary {
    background: var(--sg-accent); border-color: var(--sg-accent);
    color: #FFFFFF; font-size: 19px; font-weight: 600;
  }
  button.primary:active { background: var(--sg-accent-quiet);
                          border-color: var(--sg-accent-quiet); }
  .row { display: flex; gap: var(--sg-space-3); }
  .row button { margin-bottom: 0; }

  input[type=text] {
    font: inherit; width: 100%; padding: 16px;
    margin-bottom: var(--sg-space-3);
    background: var(--sg-surface); color: var(--sg-text);
    border: 1px solid var(--sg-line); border-radius: var(--sg-radius);
  }
  input[type=text]::placeholder { color: var(--sg-muted); opacity: .7; }

  .hint { font-size: var(--sg-text-sm); color: var(--sg-muted); margin: 0 0 var(--sg-space-2); }

  /* What was heard, in the reader's own words — Clay Beige is the guidebook's
     "the person's side" colour, and it is the one place it appears. */
  .said {
    /* A bubble on the reader's side, like the mockup's thread: right-aligned
       and NOT full width, so the two voices are distinguishable at a glance
       before a word is read. `margin-left:auto` rather than a flex row —
       there is no row to make, and one line of CSS beats a wrapper element
       the script would have to know about. */
    max-width: 78%; margin: var(--sg-space-1) 0 var(--sg-space-3) auto;
    width: fit-content;
    font-size: var(--sg-text-sm); color: var(--sg-text);
    padding: 10px 13px; border-radius: var(--sg-radius-lg);
    border-bottom-right-radius: var(--sg-radius-sm);
    background: color-mix(in srgb, var(--sg-quiet) 45%, transparent);
  }
  .said:empty { display: none; padding: 0; background: none; }

  /* The node's answer: a card, with the state carried by the left rule rather
     than by the whole surface — a wash of Soft Neon Green behind a sentence
     would be unreadable (1.36 against Off-White, measured in the theme). */
  .answer {
    /* …and the node's side is a card, left, with the corner nearest the
       speaker squared off — the mockup's asymmetry, which is what makes a
       thread read as a conversation rather than as a list. */
    max-width: 86%; width: fit-content;
    background: var(--sg-surface); border: 1px solid var(--sg-line);
    border-left: 4px solid var(--sg-info);
    border-radius: var(--sg-radius);
    border-bottom-left-radius: var(--sg-radius-sm);
    padding: 14px;
    margin-top: var(--sg-space-4); box-shadow: var(--sg-shadow);
  }
  .answer.ok  { border-left-color: var(--sg-ok); }
  .answer.bad { border-left-color: var(--sg-warn); }

  .queue {
    font-family: var(--sg-font-mono); font-size: var(--sg-text-xs);
    color: var(--sg-muted); margin-top: var(--sg-space-4);
  }
  .queue:empty { display: none; }

  img.shot {
    max-width: 100%; border-radius: var(--sg-radius);
    margin-top: var(--sg-space-3); border: 1px solid var(--sg-line);
  }
</style>
</head>
<body>
<header>
  <img src="./brand/logo/favicon-deep-charcoal.svg" alt="" width="30" height="30">
  <div class="brand"><b>StratiGraph</b><span>assistente di campo</span></div>
  <span class="state" id="state">…</span>
</header>
<main>
  <!-- The three gestures of the MVP, and nothing else on the screen. -->
  <button class="primary" id="rec">🎙 Tieni premuto e parla</button>
  <div class="row">
    <button id="shoot">📷 Scatta</button>
    <button id="where">📍 Dove sono</button>
  </div>
  <p class="hint" id="hint">Se il microfono non c'è, scrivi il comando qui sotto.</p>
  <input type="text" id="typed" placeholder="crea una nuova scheda, US 12" enterkeyhint="send">
  <button id="send">Manda</button>
  <img class="shot" id="shot" hidden alt="">
  <div class="said" id="said"></div>
  <div class="answer" id="answer" hidden></div>
  <div class="queue" id="queue"></div>
</main>

<input type="file" id="camera" accept="image/*" capture="environment" hidden>

<script>
// ── the node ────────────────────────────────────────────────────────────────
// Same origin: this page is served BY the field node, so there is no host to
// configure and nothing to get wrong on a phone somebody just handed you.
// WHERE THE NODE IS, derived from this document's own URL — never written down.
//
// The page is served at the origin's root in development (`uvicorn --port 8020`,
// with `--reload`, which is a loop worth keeping) and under `/chat/` behind the
// node's Caddy, where every StratiGraph face shares one https origin. Under a
// prefix, `location.origin` is WRONG in a way that does not look wrong: it makes
// `/v1/say` mean the ROOM SERVER's `/v1/say`, because on a shared origin `/v1`
// is not this app's.
//
// `new URL(".", href)` is the document's own directory: `http://host:8020/` in
// development, `https://host:8443/chat/` behind the proxy. Same page, both
// places, and nothing to configure.
const NODE = new URL(".", location.href).href.replace(/\/+$/, "");
// The token is kept in memory only — never in localStorage. A field device is
// lent, dropped and borrowed; a token on its disk outlives the person holding it.
let TOKEN = new URLSearchParams(location.search).get("token") || "";

const $ = (id) => document.getElementById(id);
const state = $("state"), answerBox = $("answer"), saidBox = $("said");

function show(ok, message, detail) {
  answerBox.hidden = false;
  answerBox.className = "answer " + (ok ? "ok" : "bad");
  answerBox.textContent = message + (detail ? ` (${detail})` : "");
  // Read it out loud: the person hearing this has their hands in the soil.
  try {
    const say = new SpeechSynthesisUtterance(message);
    say.lang = "it-IT";
    speechSynthesis.speak(say);
  } catch { /* no voice on this device: the text is still there */ }
}

// ── the queue ───────────────────────────────────────────────────────────────
// Offline-first is the base case, not a fallback: a trench has no signal and
// the node is on the surface. Anything that cannot be sent now is kept, in
// order, and sent when the node answers again. Nothing is lost and nothing is
// sent twice out of order.
const QUEUE_KEY = "sg.queue.v1";
const readQueue = () => JSON.parse(localStorage.getItem(QUEUE_KEY) || "[]");
const writeQueue = (q) => localStorage.setItem(QUEUE_KEY, JSON.stringify(q));

function renderQueue() {
  const n = readQueue().length;
  $("queue").textContent = n ? `${n} in coda, li mando appena torna il nodo.` : "";
}

async function post(path, body) {
  const res = await fetch(NODE + path, {
    method: "POST",
    headers: { "Content-Type": "application/json",
               ...(TOKEN ? { Authorization: "Bearer " + TOKEN } : {}) },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

async function send(path, body, describe) {
  try {
    const answer = await post(path, body);
    show(answer.ok, answer.message, answer.tool || "");
    return true;
  } catch (err) {
    const queue = readQueue();
    queue.push({ path, body, at: Date.now(), describe });
    writeQueue(queue);
    renderQueue();
    show(false, "Nodo non raggiungibile: l'ho messo in coda.", describe);
    return false;
  }
}

async function flush() {
  const queue = readQueue();
  if (!queue.length) return;
  const left = [];
  for (const item of queue) {
    try { await post(item.path, item.body); }
    catch { left.push(item); }          // still down: keep the ORDER
  }
  writeQueue(left);
  renderQueue();
  if (queue.length && !left.length) show(true, `Ho mandato ${queue.length} cose in coda.`);
}

// ── is the node there? ──────────────────────────────────────────────────────
async function ping() {
  try {
    const res = await fetch(NODE + "/health", { cache: "no-store" });
    const health = await res.json();
    state.className = "state";
    state.textContent = health.writes_to.startsWith("room") ? "nodo · stanza" : "nodo · locale";
    flush();
  } catch {
    state.className = "state off";
    state.textContent = "offline";
  }
}
setInterval(ping, 8000);
ping();
renderQueue();
addEventListener("online", flush);

// ── speak ───────────────────────────────────────────────────────────────────
// The browser's own recogniser when it has one (it is free and it is on the
// device); the node's engine otherwise, by sending the recording. Either way
// the sentence goes to the same route.
let recognition = null;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  recognition = new SR();
  recognition.lang = "it-IT";
  recognition.interimResults = false;
  recognition.onresult = (e) => {
    const said = e.results[0][0].transcript;
    saidBox.textContent = "Ho sentito: " + said;
    send("/v1/say", { transcript: said }, said);
  };
  recognition.onerror = () => show(false, "Non ho sentito.");
} else {
  $("rec").disabled = true;
  $("hint").textContent = "Questo browser non ascolta: scrivi il comando.";
}
$("rec").addEventListener("click", () => {
  if (!recognition) return;
  saidBox.textContent = "In ascolto…";
  try { recognition.start(); } catch { /* already listening */ }
});

// ── type ────────────────────────────────────────────────────────────────────
async function sendTyped() {
  const said = $("typed").value.trim();
  if (!said) return;
  saidBox.textContent = "Ho letto: " + said;
  $("typed").value = "";
  await send("/v1/say", { transcript: said }, said);
}
$("send").addEventListener("click", sendTyped);
$("typed").addEventListener("keydown", (e) => { if (e.key === "Enter") sendTyped(); });

// ── shoot ───────────────────────────────────────────────────────────────────
$("shoot").addEventListener("click", () => $("camera").click());
$("camera").addEventListener("change", async () => {
  const file = $("camera").files[0];
  if (!file) return;
  const shot = $("shot");
  shot.src = URL.createObjectURL(file);
  shot.hidden = false;
  const base64 = await new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(",")[1]);
    reader.readAsDataURL(file);
  });
  // Which unit? Whatever the last sentence said — and if it said none, the
  // node refuses and SAYS so, which is better than this page guessing.
  const us = (saidBox.textContent.match(/\b(\d{1,5})\b/) || [])[1] || "";
  await send("/v1/photo", {
    transcript: "questa foto è per la US " + us, us,
    photo_base64: base64, filename: file.name,
    media_type: file.type || "image/jpeg",
  }, file.name);
});

// ── where ───────────────────────────────────────────────────────────────────
$("where").addEventListener("click", () => {
  send("/v1/say", { transcript: "in che progetto sto lavorando" }, "progetto");
  navigator.geolocation?.getCurrentPosition(
    (pos) => { saidBox.textContent =
      `Qui: ${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`; },
    () => { /* no fix: the answer above is still useful */ });
});

// The service worker, RELATIVE — and the scope is the reason, not the path.
//
// `register("/sw.js")` under `/chat/` fails twice: the file is not there, and a
// worker registered at the origin's root would claim scope `/` — intercepting
// the fetches of the room server, the catalogue and IIIF, which share this
// origin. That is a bug nobody sees until it is horrible.
//
// `./sw.js` resolves against this document, so the worker is fetched from
// `/chat/sw.js` and its scope is `/chat/` — its own directory, which is exactly
// the reach it should have. `scope: "./"` says so out loud rather than relying
// on the default; a WIDER scope would need a `Service-Worker-Allowed` header,
// and wanting one would be the sign of a mistake.
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(() => {});
}
</script>
</body>
</html>
