<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1EBE3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2E2D2C" media="(prefers-color-scheme: dark)">
<title>StratiGraph · assistente di campo</title>
<link rel="icon" href="./brand/logo/favicon-deep-charcoal.svg" type="image/svg+xml">
<!--
  The field client (design note §6): a PWA, not a native app. ATRIUM is already
  a web app, the ecosystem is web-first, and one codebase reaches phones and
  tablets on both platforms with camera, microphone and GPS through the browser.
  The heavy AI stays on the node; this stays thin.

  Deliberately no framework and no build step: it is served by the Field
  Computing Node to a device on a trench's wifi, and every kilobyte and every
  dependency is a thing that can fail three metres underground.

  THE LOOK is the StratiGraph guidebook's (WP1), and it arrives as a VENDORED
  theme — `brand/`, copied in by `sync-brand.sh` from `stratigraph-brand/`. Not a
  CDN and not a fetch from the node: this has to be legible when the node is the
  thing that is down. Every colour below is a role token from that file; there
  is not one hex in this page.
-->
<link rel="stylesheet" href="./brand/stratigraph-theme.css">
<style>
  * { box-sizing: border-box; }
  /* `hidden` is made to win in the THEME, not here: it is a thing all four
     StratiGraph faces need, and this page is where the bug was found, not where
     it belongs. See `[hidden]` in `brand/stratigraph-theme.css`. */
  body {
    margin: 0;
    font: var(--sg-weight-body) 16px/1.55 var(--sg-font-sans);
    background: var(--sg-bg);
    color: var(--sg-text);
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }

  /* ── the header: the hourglass, who we are, whether the node answers ────── */
  header {
    display: flex; align-items: center; gap: var(--sg-space-3);
    padding: var(--sg-space-4) var(--sg-space-4) var(--sg-space-3);
    border-bottom: 1px solid var(--sg-line);
  }
  header img { width: 30px; height: 30px; flex: none; }
  /* The mark is dark ink on the light ground and light ink on the dark one —
     the guidebook ships both, so neither is a filter over the other. */
  @media (prefers-color-scheme: dark) {
    header img { content: url("./brand/logo/favicon-off-white.svg"); }
  }
  .brand { line-height: 1; }
  .brand b {
    font-family: var(--sg-font-display); font-weight: var(--sg-weight-headline);
    font-size: var(--sg-text-lg); letter-spacing: .2px;
  }
  /* Sentence case. The guidebook's voice is quiet; SHOUTING IN CAPS is not it —
     the one exception is this label, where the letter-spacing does the work of
     a rule and the words are two. */
  .brand span {
    display: block; margin-top: 2px;
    font-size: var(--sg-text-xs); color: var(--sg-accent-quiet);
    letter-spacing: .6px;
  }
  .state {
    margin-left: auto; text-align: right;
    font-family: var(--sg-font-mono); font-size: var(--sg-text-xs);
    color: var(--sg-muted);
  }
  .state.off { color: var(--sg-warn); }

  main { padding: var(--sg-space-4); max-width: 640px; margin: 0 auto; }

  /* ── the gestures. Big targets: used with gloves on, standing in a trench. ─ */
  button {
    font: inherit; width: 100%; margin-bottom: var(--sg-space-3);
    padding: 18px; text-align: left; cursor: pointer;
    background: var(--sg-surface); color: var(--sg-text);
    border: 1px solid var(--sg-line); border-radius: var(--sg-radius);
    box-shadow: var(--sg-shadow);
  }
  button:active { background: var(--sg-surface-sunk); }
  button[disabled] { opacity: .45; box-shadow: none; }
  /* The primary action is Burnt Orange — the guidebook's action colour, used
     for the action and for nothing else on this screen.

     AND ITS LABEL IS 19px/600, which is not a style choice. White on Burnt
     Orange measures 3.53 (and Deep Charcoal on it, 3.89): both fail AA's 4.5
     for normal text. At 19px semibold the label is WCAG "large text"
     (>= 14pt bold), where the bar is 3:1 — which 3.53 clears. So the brand's
     action colour keeps its job and the words stay readable, and the size is
     right for a gloved hand anyway. Shrinking this label breaks the contrast;
     that is why the number is here. */
  button.primary {
    background: var(--sg-accent); border-color: var(--sg-accent);
    color: #FFFFFF; font-size: 19px; font-weight: 600;
  }
  button.primary:active { background: var(--sg-accent-quiet);
                          border-color: var(--sg-accent-quiet); }
  .row { display: flex; gap: var(--sg-space-3); }
  .row button { margin-bottom: 0; }

  input[type=text] {
    font: inherit; width: 100%; padding: 16px;
    margin-bottom: var(--sg-space-3);
    background: var(--sg-surface); color: var(--sg-text);
    border: 1px solid var(--sg-line); border-radius: var(--sg-radius);
  }
  input[type=text]::placeholder { color: var(--sg-muted); opacity: .7; }

  .hint { font-size: var(--sg-text-sm); color: var(--sg-muted); margin: 0 0 var(--sg-space-2); }

  /* What was heard, in the reader's own words — Clay Beige is the guidebook's
     "the person's side" colour, and it is the one place it appears. */
  .said {
    /* A bubble on the reader's side, like the mockup's thread: right-aligned
       and NOT full width, so the two voices are distinguishable at a glance
       before a word is read. `margin-left:auto` rather than a flex row —
       there is no row to make, and one line of CSS beats a wrapper element
       the script would have to know about. */
    max-width: 78%; margin: var(--sg-space-1) 0 var(--sg-space-3) auto;
    width: fit-content;
    font-size: var(--sg-text-sm); color: var(--sg-text);
    padding: 10px 13px; border-radius: var(--sg-radius-lg);
    border-bottom-right-radius: var(--sg-radius-sm);
    background: color-mix(in srgb, var(--sg-quiet) 45%, transparent);
  }
  .said:empty { display: none; padding: 0; background: none; }

  /* The node's answer: a card, with the state carried by the left rule rather
     than by the whole surface — a wash of Soft Neon Green behind a sentence
     would be unreadable (1.36 against Off-White, measured in the theme). */
  .answer {
    /* …and the node's side is a card, left, with the corner nearest the
       speaker squared off — the mockup's asymmetry, which is what makes a
       thread read as a conversation rather than as a list. */
    max-width: 86%; width: fit-content;
    background: var(--sg-surface); border: 1px solid var(--sg-line);
    border-left: 4px solid var(--sg-info);
    border-radius: var(--sg-radius);
    border-bottom-left-radius: var(--sg-radius-sm);
    padding: 14px;
    margin-top: var(--sg-space-4); box-shadow: var(--sg-shadow);
  }
  .answer.ok  { border-left-color: var(--sg-ok); }
  .answer.bad { border-left-color: var(--sg-warn); }

  .queue {
    font-family: var(--sg-font-mono); font-size: var(--sg-text-xs);
    color: var(--sg-muted); margin-top: var(--sg-space-4);
  }
  .queue:empty { display: none; }

  /* ── the signature: who this device writes as, and how to hand it over ──
     A strip of its own under the header rather than a third thing crammed into
     it: on a phone held sideways in a trench the header already carries the
     mark, the name and the node's state, and an ORCID is 19 characters. It also
     reads as what it is — a signature line, the thing you check before you
     dictate. */
  .signature {
    display: flex; align-items: center; gap: var(--sg-space-2);
    padding: 9px var(--sg-space-4);
    border-bottom: 1px solid var(--sg-line);
    background: var(--sg-surface-sunk);
    font-family: var(--sg-font-mono); font-size: var(--sg-text-xs);
    color: var(--sg-muted);
  }
  .signature b {
    font-family: var(--sg-font-sans); font-weight: 600;
    font-size: var(--sg-text-sm); color: var(--sg-text);
  }
  /* The hand-over. Small on purpose — it must be reachable in seconds (the
     tablet changes hands all day) and not reachable by a thumb steadying the
     device. */
  .signature button {
    width: auto; margin: 0 0 0 auto; padding: 8px 13px;
    font-size: var(--sg-text-xs); box-shadow: none;
  }

  /* ── the gate ─────────────────────────────────────────────────────────────
     What stands where the three gestures are when nobody has signed. Not a
     banner over a working page: the page does not work, and showing an input
     that accepts dictation it could never attribute would be the worst lie to
     put in the hands of somebody standing in a trench. */
  #gate p { margin: 0 0 var(--sg-space-4); }

  img.shot {
    max-width: 100%; border-radius: var(--sg-radius);
    margin-top: var(--sg-space-3); border: 1px solid var(--sg-line);
  }
</style>
</head>
<body>
<header>
  <img src="./brand/logo/favicon-deep-charcoal.svg" alt="" width="30" height="30">
  <div class="brand"><b>StratiGraph</b><span>assistente di campo</span></div>
  <span class="state" id="state">…</span>
</header>
<div class="signature" id="signature" hidden>
  firmato <b id="who-name"></b> <span id="who-subject"></span>
  <button id="signout">Esci</button>
</div>
<main>
  <!-- Nobody has signed: this is the whole screen. -->
  <section id="gate" hidden>
    <p class="hint" id="gate-why"></p>
    <button class="primary" id="signin" hidden>✍️ Firma per iniziare</button>
  </section>

  <!-- The three gestures of the MVP, and nothing else on the screen. -->
  <section id="work" hidden>
    <button class="primary" id="rec">🎙 Tieni premuto e parla</button>
    <div class="row">
      <button id="shoot">📷 Scatta</button>
      <button id="where">📍 Dove sono</button>
    </div>
    <p class="hint" id="hint">Se il microfono non c'è, scrivi il comando qui sotto.</p>
    <input type="text" id="typed" placeholder="crea una nuova scheda, US 12" enterkeyhint="send">
    <button id="send">Manda</button>
    <img class="shot" id="shot" hidden alt="">
    <div class="said" id="said"></div>
  </section>

  <div class="answer" id="answer" hidden></div>
  <div class="queue" id="queue"></div>
</main>

<input type="file" id="camera" accept="image/*" capture="environment" hidden>

<script>
// ── the node ────────────────────────────────────────────────────────────────
// Same origin: this page is served BY the field node, so there is no host to
// configure and nothing to get wrong on a phone somebody just handed you.
// WHERE THE NODE IS, derived from this document's own URL — never written down.
//
// The page is served at the origin's root in development (`uvicorn --port 8020`,
// with `--reload`, which is a loop worth keeping) and under `/chat/` behind the
// node's Caddy, where every StratiGraph face shares one https origin. Under a
// prefix, `location.origin` is WRONG in a way that does not look wrong: it makes
// `/v1/say` mean the ROOM SERVER's `/v1/say`, because on a shared origin `/v1`
// is not this app's.
//
// `new URL(".", href)` is the document's own directory: `http://host:8020/` in
// development, `https://host:8443/chat/` behind the proxy. Same page, both
// places, and nothing to configure.
const HERE = new URL(".", location.href).href;
const NODE = HERE.replace(/\/+$/, "");

// ── who is writing ──────────────────────────────────────────────────────────
//
// THE RULE THIS SECTION EXISTS FOR: no ingestion without an author. A card
// dictated in a trench that enters the graph without saying who dictated it is
// not a record with a field missing — it is a record nobody can use, because
// attribution, embargo, licence and the whole DTC plan rest on who did what.
// The node already refuses to write without an identity (`contract.py`:
// "Non posso scrivere senza sapere chi sei"); this is the same rule made
// visible, BEFORE somebody speaks into a form that could never keep it.
//
// The corollary, accepted: one device, one signed person at a time. A tablet
// that changes hands does not become anonymous — it changes signature, and the
// change has to cost seconds.
//
// The flow is Authorization Code + PKCE IN THE BROWSER, and deliberately not
// the loopback dance the three native surfaces do (EMStudio, EMtools, the
// chatbot process): those open a listener on 127.0.0.1 because they have no URL
// of their own. A page has one, and it is its own. The shape below is the
// node console's `app/node_admin/auth.js`, which does this already — read that
// file for the long version of every comment here; it is not vendored because
// this page has no build step and no imports on purpose.
//
// The token is kept in memory only — never in localStorage. A field device is
// lent, dropped and borrowed; a token on its disk outlives the person holding it.
let TOKEN = "";
//: who that token says is speaking: {subject, name}. `subject` is the ORCID —
//: a public identifier, the very one that lands in the graph, which is why it
//: may be written next to a queued note while the token may not.
let WHO = null;
//: how this node wants a browser to sign in (`GET /v1/auth-config`), or null.
let AUTHCFG = null;

// The SERVICE DOOR, kept on purpose: `?token=…` is how the smokes and the bench
// drive this page without a person in front of Keycloak. It is not scrubbed off
// the address bar the way an authorization code is, and that is a decision, not
// an oversight: the whole convenience of the door is that the URL carries the
// token, and a page that forgot it on reload would be a bench trick that works
// once. It is therefore a HAZARD in a screenshot — which is exactly why it is a
// bench door and not the way anybody signs.
const SERVICE_TOKEN = new URLSearchParams(location.search).get("token") || "";

// Where an ORCID lands in a Keycloak token, in the spellings a realm may use.
// THE SAME LIST AND THE SAME ORDER as `ORCID_CLAIMS` in `app/auth.py`: the node
// stamps the author from the token, this page only SHOWS it and files it beside
// a queued note, and the two disagreeing would mean a queue held for a person
// the node thinks is somebody else.
const ORCID_CLAIMS = ["orcid", "orcid_id", "https://orcid.org/id",
                      "preferred_username"];

// The claims, read WITHOUT verifying the signature — display only, and it must
// stay that way. Nothing here decides anything: the node checks the signature
// against the realm's JWKS and takes the author from what it verified. A page
// that trusted this would be a page you could talk into a name.
function claimsOf(jwt) {
  try {
    const payload = String(jwt).split(".")[1];
    const bytes = Uint8Array.from(
      atob(payload.replace(/-/g, "+").replace(/_/g, "/")),
      (c) => c.charCodeAt(0));
    return JSON.parse(new TextDecoder().decode(bytes)) || {};
  } catch { return {}; }
}

function subjectOf(claims) {
  for (const key of ORCID_CLAIMS) {
    const value = claims[key];
    if (typeof value === "string" && value.trim()) return value.trim();
  }
  return claims.sub ? String(claims.sub) : "";
}

/** Adopt a token: this is the ONE place TOKEN is assigned from. */
function adopt(token) {
  TOKEN = token || "";
  const claims = TOKEN ? claimsOf(TOKEN) : {};
  WHO = TOKEN
    ? { subject: subjectOf(claims),
        name: claims.name || claims.preferred_username || subjectOf(claims) }
    : null;
  render();
}

const $ = (id) => document.getElementById(id);
const state = $("state"), answerBox = $("answer"), saidBox = $("said");

function show(ok, message, detail) {
  answerBox.hidden = false;
  answerBox.className = "answer " + (ok ? "ok" : "bad");
  answerBox.textContent = message + (detail ? ` (${detail})` : "");
  // Read it out loud: the person hearing this has their hands in the soil.
  try {
    const say = new SpeechSynthesisUtterance(message);
    say.lang = "it-IT";
    speechSynthesis.speak(say);
  } catch { /* no voice on this device: the text is still there */ }
}

// ── signing in ──────────────────────────────────────────────────────────────

/** The redirect URI: this page's own directory, WITH its trailing slash.
 *
 *  Computed and never written down, for the same reason `NODE` is: the page is
 *  served at `http://localhost:8020/` in development and at
 *  `https://…:8443/chat/` behind the node's Caddy. Anything literal here would
 *  be right in one place and wrong in the other — and a wrong redirect URI
 *  fails at the IdP, far from the line that caused it. The realm has to list
 *  both; when it does not, Keycloak says so at the last step and `signInReturn`
 *  below surfaces that sentence rather than a code. */
const redirectUri = () => HERE;

async function loadAuthConfig() {
  try {
    const answer = await fetch(NODE + "/v1/auth-config",
                               { headers: { Accept: "application/json" } });
    return answer.ok ? await answer.json() : null;
  } catch { return null; }
}

const canSign = () =>
  Boolean(AUTHCFG && AUTHCFG.enforcing && AUTHCFG.authorization_endpoint
          && AUTHCFG.client_id);

// The verifier and the state have to survive the trip to Keycloak and back —
// the page is unloaded in between — so they go in sessionStorage, which dies
// with the tab. They are not credentials: they are use-and-throw, and the
// verifier is DELETED the moment the code is exchanged. One left behind is a
// spare key on the doormat.
const PKCE_KEY = "sg.pkce" + location.pathname;

function base64url(bytes) {
  let text = "";
  for (const byte of bytes) text += String.fromCharCode(byte);
  return btoa(text).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

function randomToken() {
  const bytes = new Uint8Array(32);
  crypto.getRandomValues(bytes);
  return base64url(bytes);
}

async function challengeFor(verifier) {
  const digest = await crypto.subtle.digest(
    "SHA-256", new TextEncoder().encode(verifier));
  return base64url(new Uint8Array(digest));
}

/** Leave for Keycloak. Does not return: the browser navigates away. */
async function signIn() {
  if (!canSign()) return;
  const verifier = randomToken();
  const state = randomToken();
  sessionStorage.setItem(PKCE_KEY, JSON.stringify({ verifier, state }));
  const url = new URL(AUTHCFG.authorization_endpoint);
  url.searchParams.set("response_type", "code");
  url.searchParams.set("client_id", AUTHCFG.client_id);
  url.searchParams.set("redirect_uri", redirectUri());
  url.searchParams.set("scope", AUTHCFG.scope || "openid");
  url.searchParams.set("code_challenge", await challengeFor(verifier));
  url.searchParams.set("code_challenge_method", "S256");
  url.searchParams.set("state", state);
  location.assign(url.toString());
}

const returningFromIdp = () => {
  const query = new URLSearchParams(location.search);
  return query.has("code") || query.has("error");
};

/** Take `?code=…&state=…` off the address bar without reloading. An
 *  authorization code in the address bar is a code in the browser history and
 *  in every screenshot somebody takes of the screen. */
function cleanUrl() {
  history.replaceState({}, "", location.pathname);
}

/** Back from Keycloak: `?code=…` → a token in memory. */
function fail(why) { show(false, "Firma non riuscita: " + why); render(); }

async function signInReturn() {
  const query = new URLSearchParams(location.search);
  const code = query.get("code");
  const error = query.get("error");
  const returned = query.get("state");
  let saved = null;
  try {
    const raw = sessionStorage.getItem(PKCE_KEY);
    sessionStorage.removeItem(PKCE_KEY);   // consumed on read
    saved = raw ? JSON.parse(raw) : null;
  } catch { /* a tab with no storage: treated as no sign-in in progress */ }
  cleanUrl();

  if (error) return fail(query.get("error_description") || error);
  if (!saved) return fail("questa scheda non aveva una firma in corso.");
  // The one check that makes the round trip mean anything: a code delivered
  // with somebody else's state is a code this tab did not ask for.
  if (saved.state && returned !== saved.state) {
    return fail("lo stato della firma non corrisponde: rifiuto un codice che "
                + "questa scheda non ha chiesto.");
  }
  let payload = null;
  try {
    const answer = await fetch(AUTHCFG.token_endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({
        grant_type: "authorization_code",
        client_id: AUTHCFG.client_id,
        code,
        redirect_uri: redirectUri(),
        code_verifier: saved.verifier,
      }).toString(),
    });
    payload = await answer.json().catch(() => null);
    if (!answer.ok) {
      return fail(payload?.error_description || payload?.error
                  || `Keycloak ha risposto ${answer.status}`);
    }
  } catch {
    // The realm is reached by the BROWSER, not by the node, and behind a proxy
    // those are two different machines. Saying which one failed is the
    // difference between a fixable problem and a mystery.
    return fail("non raggiungo Keycloak da questo dispositivo.");
  }
  adopt(payload.access_token || "");
  if (!TOKEN) return fail("Keycloak non ha restituito un token.");
}

/** Sign OUT of the realm, not only of this tab.
 *
 *  THE TRAP THIS CLOSES, and the reason the whole file exists: if "esci" merely
 *  forgot the token, the next touch on "firma" would bounce off Keycloak, find
 *  its session COOKIE still valid, and walk back in silently AS THE PREVIOUS
 *  PERSON. The tablet would change hands without changing author and nobody
 *  would see it. So the browser goes through `end_session_endpoint` first, and
 *  the page comes back unsigned because it comes back fresh. */
function signOut() {
  TOKEN = ""; WHO = null;
  if (AUTHCFG && AUTHCFG.end_session_endpoint && AUTHCFG.client_id) {
    const url = new URL(AUTHCFG.end_session_endpoint);
    url.searchParams.set("client_id", AUTHCFG.client_id);
    url.searchParams.set("post_logout_redirect_uri", redirectUri());
    location.assign(url.toString());
    return;
  }
  // No end-session endpoint: this tab is clean, and we SAY that the realm's
  // session is not — better a sentence than a silent half-logout.
  render();
  show(false, "Uscito da questo dispositivo. Il nodo non espone un logout del "
              + "realm, quindi la sessione di Keycloak può essere ancora aperta.");
}

// ── what the screen shows ───────────────────────────────────────────────────
function render() {
  const signed = Boolean(TOKEN);
  $("work").hidden = !signed;
  $("gate").hidden = signed;
  $("signature").hidden = !signed;
  if (signed) {
    $("who-name").textContent = WHO?.name || "—";
    $("who-subject").textContent = WHO?.subject ? "· " + WHO.subject : "";
  } else {
    $("signin").hidden = !canSign();
    $("gate-why").textContent = canSign()
      ? "Firma con la tua identità: quello che detti entra nel grafo a tuo nome."
      : (AUTHCFG
         // A bare gate cannot be told apart from a forgotten variable, and the
         // person meeting it is standing in a trench. So the node NAMES what is
         // in the way (`missing`, the same list `/health` publishes) and the
         // gate repeats it — the habit `auth.py` set when it refuses to start
         // on a half-configured realm rather than behaving oddly.
         ? "Questo nodo non chiede la firma, quindi non può attribuire a "
           + "nessuno quello che diresti: le dettature verrebbero rifiutate."
           + (AUTHCFG.missing?.length
              ? " Manca: " + AUTHCFG.missing.join(" · ") + "."
              : "")
         : "Non riesco a chiedere al nodo come si firma. Senza firma non posso "
           + "accettare dettature, perché nessuno potrebbe esserne l'autore.");
  }
  renderQueue();
}

// ── the queue ───────────────────────────────────────────────────────────────
// Offline-first is the base case, not a fallback: a trench has no signal and
// the node is on the surface. Anything that cannot be sent now is kept, in
// order, and sent when the node answers again. Nothing is lost and nothing is
// sent twice out of order.
const QUEUE_KEY = "sg.queue.v1";
const readQueue = () => JSON.parse(localStorage.getItem(QUEUE_KEY) || "[]");
const writeQueue = (q) => localStorage.setItem(QUEUE_KEY, JSON.stringify(q));

// EVERY QUEUED NOTE CARRIES WHO DICTATED IT, stamped at the moment it was
// dictated. Without that: a note queued by Anna at 10:00 and sent at 14:00,
// when Marco is the one signed on the tablet, becomes a note BY MARCO — and the
// node cannot notice, because it takes the author from the token it sees and
// does the right thing with the wrong fact.
//
// The subject is an ORCID, which is not a credential: it is the public
// identifier that will end up in the graph anyway. So it may sit on disk beside
// the note. The token may not, and does not.
const isMine = (item, subject) => Boolean(subject) && item.subject === subject;

//: A note dictated before signatures existed on this device. It is not sent and
//: it is not silently re-attributed — both would be worse than waiting.
const UNSIGNED = "\u0000unsigned";

/** Which notes may go now, and which wait for whom. Pure, and named, because it
 *  is the whole of design note §3.2 and a rule worth stating is a rule worth
 *  running in a test. */
function partitionQueue(queue, subject) {
  const mine = [], held = [];
  for (const item of queue) (isMine(item, subject) ? mine : held).push(item);
  return { mine, held };
}

/** The held notes, counted by the person waiting for them. */
function heldBy(held) {
  const counts = new Map();
  for (const item of held) {
    const label = item.by || item.subject || UNSIGNED;
    counts.set(label, (counts.get(label) || 0) + 1);
  }
  return [...counts.entries()];
}

function queueSentence(queue, subject) {
  const { mine, held } = partitionQueue(queue, subject);
  const lines = [];
  if (mine.length) lines.push(`${mine.length} in coda, li mando appena torna il nodo.`);
  for (const [label, n] of heldBy(held)) {
    const noun = n === 1 ? "nota" : "note";
    lines.push(label === UNSIGNED
      ? `${n} ${noun} senza firma, dettate prima che la firma esistesse: restano in coda.`
      : `${n} ${noun} di ${label} in attesa che rientri.`);
  }
  return lines.join(" ");
}

function renderQueue() {
  $("queue").textContent = queueSentence(readQueue(), WHO?.subject || "");
}

async function post(path, body) {
  const res = await fetch(NODE + path, {
    method: "POST",
    headers: { "Content-Type": "application/json",
               ...(TOKEN ? { Authorization: "Bearer " + TOKEN } : {}) },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

async function send(path, body, describe) {
  try {
    const answer = await post(path, body);
    show(answer.ok, answer.message, answer.tool || "");
    return true;
  } catch (err) {
    const queue = readQueue();
    queue.push({ path, body, at: Date.now(), describe,
                 subject: WHO?.subject || "", by: WHO?.name || "" });
    writeQueue(queue);
    renderQueue();
    show(false, "Nodo non raggiungibile: l'ho messo in coda.", describe);
    return false;
  }
}

async function flush() {
  const queue = readQueue();
  if (!queue.length) return;
  const subject = WHO?.subject || "";
  const left = [];
  let sent = 0;
  for (const item of queue) {
    // Somebody else's note WAITS. It is not refused, not re-attributed and not
    // lost — it goes back in the queue in its place, and the line under the
    // buttons says whose it is and that it is waiting for them.
    if (!isMine(item, subject)) { left.push(item); continue; }
    try { await post(item.path, item.body); sent++; }
    catch { left.push(item); }          // still down: keep the ORDER
  }
  writeQueue(left);
  renderQueue();
  if (sent) show(true, `Ho mandato ${sent} ${sent === 1 ? "cosa" : "cose"} in coda.`);
}

// ── is the node there? ──────────────────────────────────────────────────────
async function ping() {
  try {
    const res = await fetch(NODE + "/health", { cache: "no-store" });
    const health = await res.json();
    state.className = "state";
    state.textContent = health.writes_to.startsWith("room") ? "nodo · stanza" : "nodo · locale";
    flush();
  } catch {
    state.className = "state off";
    state.textContent = "offline";
  }
}
$("signin").addEventListener("click", signIn);
$("signout").addEventListener("click", signOut);

// ── starting up ─────────────────────────────────────────────────────────────
//
// The order matters. The config comes FIRST because everything else is a
// decision that needs it: whether a sign-in is even possible, which endpoint to
// exchange a code at, what the gate should say. Only then is the returning
// `?code=` worth looking at — and only then does the screen get drawn, so that
// the three gestures never appear for an instant to somebody who has not signed.
async function boot() {
  AUTHCFG = await loadAuthConfig();
  if (returningFromIdp()) {
    await signInReturn();
  } else if (SERVICE_TOKEN) {
    adopt(SERVICE_TOKEN);               // the bench door, declared above
  }
  render();
  ping();
  setInterval(ping, 8000);
  addEventListener("online", flush);
}
boot();

// ── speak ───────────────────────────────────────────────────────────────────
// The browser's own recogniser when it has one (it is free and it is on the
// device); the node's engine otherwise, by sending the recording. Either way
// the sentence goes to the same route.
let recognition = null;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  recognition = new SR();
  recognition.lang = "it-IT";
  recognition.interimResults = false;
  recognition.onresult = (e) => {
    const said = e.results[0][0].transcript;
    saidBox.textContent = "Ho sentito: " + said;
    send("/v1/say", { transcript: said }, said);
  };
  recognition.onerror = () => show(false, "Non ho sentito.");
} else {
  $("rec").disabled = true;
  $("hint").textContent = "Questo browser non ascolta: scrivi il comando.";
}
$("rec").addEventListener("click", () => {
  if (!recognition) return;
  saidBox.textContent = "In ascolto…";
  try { recognition.start(); } catch { /* already listening */ }
});

// ── type ────────────────────────────────────────────────────────────────────
async function sendTyped() {
  const said = $("typed").value.trim();
  if (!said) return;
  saidBox.textContent = "Ho letto: " + said;
  $("typed").value = "";
  await send("/v1/say", { transcript: said }, said);
}
$("send").addEventListener("click", sendTyped);
$("typed").addEventListener("keydown", (e) => { if (e.key === "Enter") sendTyped(); });

// ── shoot ───────────────────────────────────────────────────────────────────
$("shoot").addEventListener("click", () => $("camera").click());
$("camera").addEventListener("change", async () => {
  const file = $("camera").files[0];
  if (!file) return;
  const shot = $("shot");
  shot.src = URL.createObjectURL(file);
  shot.hidden = false;
  const base64 = await new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(",")[1]);
    reader.readAsDataURL(file);
  });
  // Which unit? Whatever the last sentence said — and if it said none, the
  // node refuses and SAYS so, which is better than this page guessing.
  const us = (saidBox.textContent.match(/\b(\d{1,5})\b/) || [])[1] || "";
  await send("/v1/photo", {
    transcript: "questa foto è per la US " + us, us,
    photo_base64: base64, filename: file.name,
    media_type: file.type || "image/jpeg",
  }, file.name);
});

// ── where ───────────────────────────────────────────────────────────────────
$("where").addEventListener("click", () => {
  send("/v1/say", { transcript: "in che progetto sto lavorando" }, "progetto");
  navigator.geolocation?.getCurrentPosition(
    (pos) => { saidBox.textContent =
      `Qui: ${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`; },
    () => { /* no fix: the answer above is still useful */ });
});

// The service worker, RELATIVE — and the scope is the reason, not the path.
//
// `register("/sw.js")` under `/chat/` fails twice: the file is not there, and a
// worker registered at the origin's root would claim scope `/` — intercepting
// the fetches of the room server, the catalogue and IIIF, which share this
// origin. That is a bug nobody sees until it is horrible.
//
// `./sw.js` resolves against this document, so the worker is fetched from
// `/chat/sw.js` and its scope is `/chat/` — its own directory, which is exactly
// the reach it should have. `scope: "./"` says so out loud rather than relying
// on the default; a WIDER scope would need a `Service-Worker-Allowed` header,
// and wanting one would be the sign of a mistake.
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(() => {});
}
</script>
</body>
